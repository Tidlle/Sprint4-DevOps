# Perfil "sqlserver": banco Azure SQL Database (PaaS). Ativado com SPRING_PROFILES_ACTIVE=sqlserver
# Credenciais NAO ficam no codigo: vem de variaveis de ambiente (App Settings do Web App, preenchidas pelo CD).
spring.application.name=clyvo-vitalpet
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-sqlserver
spring.flyway.baseline-on-migrate=true

spring.h2.console.enabled=false

spring.cache.type=simple
spring.cache.cache-names=clinicas,tutores,pets,veterinarios,consultas,alertas,acompanhamentos,dashboard

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
