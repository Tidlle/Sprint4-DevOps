<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VitalPet - Clínicas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: topo('clinicas')}"></div>
<main>
    <h1>Clínicas</h1>

    <p class="alerta-flash sucesso" th:if="${sucesso}" th:text="${sucesso}">ok</p>

    <form class="filtro" method="get" th:action="@{/web/clinicas}">
        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" th:value="${nome}">
        </div>
        <button type="submit">Filtrar</button>
        <a class="btn secundario" th:href="@{/web/clinicas/novo}">Nova clínica</a>
    </form>

    <div class="tabela-wrap">
    <table>
        <thead>
        <tr>
            <th>Nome</th>
            <th>Cidade/UF</th>
            <th>Telefone</th>
            <th>E-mail</th>
            <th>Veterinários</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${pagina.content}" th:classappend="${!c.ativa()} ? 'inativo'">
            <td th:text="${c.nome()}">Nome</td>
            <td th:text="${c.cidade() + '/' + c.estado()}">Cidade/UF</td>
            <td th:text="${c.telefone()}">Telefone</td>
            <td th:text="${c.email()}">E-mail</td>
            <td th:text="${c.quantidadeVeterinarios()}">0</td>
            <td>
                <span class="badge" th:classappend="${c.ativa()} ? 'ok' : 'critico'" th:text="${c.ativa()} ? 'Ativa' : 'Inativa'">Status</span>
            </td>
            <td class="acoes">
                <a class="btn secundario" th:href="@{'/web/clinicas/' + ${c.id()} + '/editar'}">Editar</a>
                <form th:if="${c.ativa()}" th:action="@{'/web/clinicas/' + ${c.id()} + '/desativar'}" method="post">
                    <button type="submit" class="perigo">Desativar</button>
                </form>
                <form th:unless="${c.ativa()}" th:action="@{'/web/clinicas/' + ${c.id()} + '/ativar'}" method="post">
                    <button type="submit">Ativar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${pagina.empty}">
            <td colspan="7">Nenhuma clínica encontrada.</td>
        </tr>
        </tbody>
    </table>
    </div>

    <div class="paginacao">
        <a th:if="${!pagina.first}" class="btn secundario" th:href="@{/web/clinicas(nome=${nome}, page=${pagina.number - 1})}">Anterior</a>
        <span>Página <span th:text="${pagina.number + 1}">1</span> de <span th:text="${pagina.totalPages == 0 ? 1 : pagina.totalPages}">1</span></span>
        <a th:if="${!pagina.last}" class="btn secundario" th:href="@{/web/clinicas(nome=${nome}, page=${pagina.number + 1})}">Próxima</a>
    </div>
</main>
</body>
</html>
