<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VitalPet - Consulta</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: topo('consultas')}"></div>
<main>
    <h1 th:text="${id == null} ? 'Nova consulta' : 'Editar consulta'">Consulta</h1>
    <p th:if="${statusAtual != null}">Status atual: <span class="badge" th:classappend="${#strings.toLowerCase(statusAtual)}" th:text="${statusAtual}">status</span></p>

    <div class="card">
        <p class="alerta-flash erro" th:if="${erro}" th:text="${erro}">Erro</p>

        <form th:object="${form}" th:action="${id == null} ? @{/web/consultas} : @{'/web/consultas/' + ${id}}" method="post">
            <div class="campo">
                <label for="dataHora">Data e hora</label>
                <input type="datetime-local" id="dataHora" name="dataHora" th:value="${form.dataHora()}">
                <span class="erro-campo" th:if="${#fields.hasErrors('dataHora')}" th:errors="*{dataHora}">erro</span>
            </div>
            <div class="campo">
                <label for="tipo">Tipo</label>
                <input type="text" id="tipo" name="tipo" th:value="${form.tipo()}" placeholder="Rotina, Retorno, Emergência...">
                <span class="erro-campo" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}">erro</span>
            </div>
            <div class="campo">
                <label for="sintomas">Sintomas</label>
                <textarea id="sintomas" name="sintomas" rows="2" th:text="${form.sintomas()}"></textarea>
            </div>
            <div class="campo">
                <label for="diagnostico">Diagnóstico</label>
                <textarea id="diagnostico" name="diagnostico" rows="2" th:text="${form.diagnostico()}"></textarea>
            </div>
            <div class="campo">
                <label for="tratamento">Tratamento</label>
                <textarea id="tratamento" name="tratamento" rows="2" th:text="${form.tratamento()}"></textarea>
            </div>
            <div class="campo">
                <label for="valor">Valor (R$)</label>
                <input type="number" id="valor" name="valor" step="0.01" min="0" th:value="${form.valor()}">
                <span class="erro-campo" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}">erro</span>
            </div>
            <div class="campo">
                <label for="petId">Pet</label>
                <select id="petId" name="petId">
                    <option value="">Selecione</option>
                    <option th:each="p : ${pets}" th:value="${p.id()}" th:text="${p.nome() + ' (tutor: ' + p.tutorNome() + ')'}"
                            th:selected="${form.petId() != null and form.petId() == p.id()}">Pet</option>
                </select>
                <span class="erro-campo" th:if="${#fields.hasErrors('petId')}" th:errors="*{petId}">erro</span>
            </div>
            <div class="campo">
                <label>Veterinário</label>
                <div th:if="${veterinarioRestrito}">
                    <input type="text" disabled th:value="${veterinarios[0].nome()}">
                    <input type="hidden" name="veterinarioId" th:value="${form.veterinarioId()}">
                </div>
                <select th:unless="${veterinarioRestrito}" id="veterinarioId" name="veterinarioId">
                    <option value="">Selecione</option>
                    <option th:each="v : ${veterinarios}" th:value="${v.id()}" th:text="${v.nome() + ' - ' + v.especialidade()}"
                            th:selected="${form.veterinarioId() != null and form.veterinarioId() == v.id()}">Veterinário</option>
                </select>
                <span class="erro-campo" th:if="${#fields.hasErrors('veterinarioId')}" th:errors="*{veterinarioId}">erro</span>
            </div>

            <button type="submit">Salvar</button>
            <a class="btn secundario" th:href="@{/web/consultas}">Cancelar</a>
        </form>
    </div>
</main>
</body>
</html>
