<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VitalPet - Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: topo('dashboard')}"></div>
<main>
    <h1>Resumo operacional</h1>
    <p class="subtitulo">
        Bem-vindo(a), <span th:text="${usuarioNome}">usuário</span>
        (<span th:text="${usuarioRole}">perfil</span>)
    </p>

    <div class="hero-grid">
        <div class="hero-card">
            <div class="hero-titulo">Consultas agendadas</div>
            <div class="hero-numero" th:text="${resumo.consultasAgendadas()}">0</div>
            <div class="hero-metricas">
                <div class="hero-metrica">
                    <span class="bolha"><img th:src="@{/img/icons/check-green.svg}" class="icone-svg" width="16" height="16" alt=""></span>
                    <span class="texto">
                        <span class="valor" th:text="${resumo.consultasConcluidas()}">0</span>
                        <span class="rotulo">Concluídas</span>
                    </span>
                </div>
                <div class="hero-metrica">
                    <span class="bolha"><img th:src="@{/img/icons/icon-bell.svg}" class="icone-svg" width="16" height="16" alt=""></span>
                    <span class="texto">
                        <span class="valor" th:text="${resumo.alertasPendentes()}">0</span>
                        <span class="rotulo">Alertas pendentes</span>
                    </span>
                </div>
                <div class="hero-metrica">
                    <span class="bolha"><img th:src="@{/img/icons/icon-emergency.svg}" class="icone-svg" width="16" height="16" alt=""></span>
                    <span class="texto">
                        <span class="valor" th:text="${resumo.alertasAltaPrioridade()}">0</span>
                        <span class="rotulo">Alta prioridade</span>
                    </span>
                </div>
            </div>
        </div>

        <div class="faturamento-card">
            <div class="rotulo">
                <img th:src="@{/img/icons/icon-finance.svg}" class="icone-svg" width="18" height="18" alt="">
                Faturamento (consultas concluídas)
            </div>
            <div class="valor" th:text="${'R$ ' + resumo.faturamentoTotal()}">R$ 0</div>
            <span class="selo">Receita realizada</span>
        </div>
    </div>

    <h2>Indicadores gerais</h2>
    <div class="resumo-grid">
        <div class="item">
            <div class="valor" th:text="${resumo.clinicasAtivas()}">0</div>
            <div class="rotulo">Clínicas ativas</div>
        </div>
        <div class="item">
            <div class="valor" th:text="${resumo.veterinariosAtivos()}">0</div>
            <div class="rotulo">Veterinários ativos</div>
        </div>
        <div class="item">
            <div class="valor" th:text="${resumo.tutoresAtivos()}">0</div>
            <div class="rotulo">Tutores ativos</div>
        </div>
        <div class="item">
            <div class="valor" th:text="${resumo.petsAtivos()}">0</div>
            <div class="rotulo">Pets ativos</div>
        </div>
    </div>
</main>
</body>
</html>
