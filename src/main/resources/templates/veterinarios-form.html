<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VitalPet - Veterinário</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: topo('veterinarios')}"></div>
<main>
    <h1 th:text="${id == null} ? 'Novo veterinário' : 'Editar veterinário'">Veterinário</h1>

    <div class="card">
        <p class="alerta-flash erro" th:if="${erro}" th:text="${erro}">Erro</p>

        <form th:object="${form}" th:action="${id == null} ? @{/web/veterinarios} : @{'/web/veterinarios/' + ${id}}" method="post">
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" th:value="${form.nome()}">
                <span class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">erro</span>
            </div>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" th:value="${form.email()}">
                <span class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">erro</span>
            </div>
            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" name="telefone" th:value="${form.telefone()}">
                <span class="erro-campo" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}">erro</span>
            </div>
            <div class="campo">
                <label for="crmv">CRMV (formato UF-0000)</label>
                <input type="text" id="crmv" name="crmv" th:value="${form.crmv()}">
                <span class="erro-campo" th:if="${#fields.hasErrors('crmv')}" th:errors="*{crmv}">erro</span>
            </div>
            <div class="campo">
                <label for="especialidade">Especialidade</label>
                <input type="text" id="especialidade" name="especialidade" th:value="${form.especialidade()}">
                <span class="erro-campo" th:if="${#fields.hasErrors('especialidade')}" th:errors="*{especialidade}">erro</span>
            </div>
            <div class="campo">
                <label for="clinicaId">Clínica</label>
                <select id="clinicaId" name="clinicaId">
                    <option value="">Selecione</option>
                    <option th:each="c : ${clinicas}" th:value="${c.id()}" th:text="${c.nome()}"
                            th:selected="${form.clinicaId() != null and form.clinicaId() == c.id()}">Clínica</option>
                </select>
                <span class="erro-campo" th:if="${#fields.hasErrors('clinicaId')}" th:errors="*{clinicaId}">erro</span>
            </div>

            <button type="submit">Salvar</button>
            <a class="btn secundario" th:href="@{/web/veterinarios}">Cancelar</a>
        </form>
    </div>
</main>
</body>
</html>
