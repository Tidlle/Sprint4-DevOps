<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VitalPet - Veterinários</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: topo('veterinarios')}"></div>
<main>
    <h1>Veterinários</h1>

    <p class="alerta-flash sucesso" th:if="${sucesso}" th:text="${sucesso}">ok</p>

    <form class="filtro" method="get" th:action="@{/web/veterinarios}">
        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" th:value="${nome}">
        </div>
        <button type="submit">Filtrar</button>
        <a class="btn secundario" th:href="@{/web/veterinarios/novo}">Novo veterinário</a>
    </form>

    <div class="tabela-wrap">
    <table>
        <thead>
        <tr>
            <th>Nome</th>
            <th>CRMV</th>
            <th>Especialidade</th>
            <th>Clínica</th>
            <th>Consultas</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${pagina.content}" th:classappend="${!v.ativo()} ? 'inativo'">
            <td th:text="${v.nome()}">Nome</td>
            <td th:text="${v.crmv()}">CRMV</td>
            <td th:text="${v.especialidade()}">Especialidade</td>
            <td th:text="${v.clinicaNome()}">Clínica</td>
            <td th:text="${v.quantidadeConsultas()}">0</td>
            <td>
                <span class="badge" th:classappend="${v.ativo()} ? 'ok' : 'critico'" th:text="${v.ativo()} ? 'Ativo' : 'Inativo'">Status</span>
            </td>
            <td class="acoes">
                <a class="btn secundario" th:href="@{'/web/veterinarios/' + ${v.id()} + '/editar'}">Editar</a>
                <form th:if="${v.ativo()}" th:action="@{'/web/veterinarios/' + ${v.id()} + '/desativar'}" method="post">
                    <button type="submit" class="perigo">Desativar</button>
                </form>
                <form th:unless="${v.ativo()}" th:action="@{'/web/veterinarios/' + ${v.id()} + '/ativar'}" method="post">
                    <button type="submit">Ativar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${pagina.empty}">
            <td colspan="7">Nenhum veterinário encontrado.</td>
        </tr>
        </tbody>
    </table>
    </div>

    <div class="paginacao">
        <a th:if="${!pagina.first}" class="btn secundario" th:href="@{/web/veterinarios(nome=${nome}, page=${pagina.number - 1})}">Anterior</a>
        <span>Página <span th:text="${pagina.number + 1}">1</span> de <span th:text="${pagina.totalPages == 0 ? 1 : pagina.totalPages}">1</span></span>
        <a th:if="${!pagina.last}" class="btn secundario" th:href="@{/web/veterinarios(nome=${nome}, page=${pagina.number + 1})}">Próxima</a>
    </div>
</main>
</body>
</html>
